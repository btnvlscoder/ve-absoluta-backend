# Configuración de Servidor
server.port=${PORT:8080}

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS (NEON)
# ============================================
# Usamos variables de entorno para no exponer las credenciales en GitHub
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ============================================
# CLOUDINARY (Object Storage)
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================
# INFERENCE - Modo de inferencia
# ============================================
# IMPORTANTE: En Render debemos usar 'cloud' para conectar con Hugging Face
inference.mode=cloud

huggingface.endpoint=https://api-inference.huggingface.co/models/btnvlscoder/ve-absoluta-apihuggingface.token=${HF_TOKEN}

# Configuración de expiración (MinIO/S3 compatible si lo usas a futuro)
minio.url-expiration=3600