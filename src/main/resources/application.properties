# Configuración de Servidor
server.port=${PORT:8080}

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS (NEON)
# ============================================
# Usamos variables de entorno para no exponer las credenciales en GitHub
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ============================================
# CLOUDINARY (Object Storage)
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================
# INFERENCE - Modo de inferencia
# ============================================
# IMPORTANTE: En Render debemos usar 'cloud' para conectar con Hugging Face
inference.mode=cloud

huggingface.endpoint=https://api-inference.huggingface.co/models/btnvlscoder/ve-absoluta-api
huggingface.token=${HF_TOKEN}

# Configuración de expiración (MinIO/S3 compatible si lo usas a futuro)
minio.url-expiration=3600

# ============================================
# VE ABSOLUTA - Reglas de Negocio
# MICROSERVICIO IA (VE ABSOLUTA ENGINE)
# ============================================
# Umbral de detección IA (0.0 a 1.0). Ejemplo: 0.65 significa 65% de certeza mínima.
ai.service.url=http://localhost:8000/api/v1/analizar
veabsoluta.ia.threshold=0.65

# ============================================
# ACTUATOR - Health Checks
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# ============================================
# SWAGGER / OPENAPI
# ============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha